
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ----------------------------------------
  # AI Gateway Proxy
  # ----------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm_proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    environment:
      - LITELLM_MASTER_KEY=sk-any-key
    env_file:
      - .env

  # Dashboard de Observabilidade (Langfuse)
  # ----------------------------------------
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: langfuse
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ai_user:ai_password@postgres:5432/postgres
      - NEXTAUTH_SECRET=my_super_secret_key
      - SALT=my_super_secret_salt
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false

  # ----------------------------------------
  # Nossos Microserviços Python
  # ----------------------------------------
  api_gateway:
    build:
      context: ./core-api
    container_name: api_gateway
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    env_file:
      - .env

  worker_recommendation:
    build:
      context: ./worker-recommendation
    container_name: worker_recommendation
    environment:
      - KAFKA_BROKER=kafka:9092
      - POSTGRES_URL=postgresql+psycopg2://ai_user:ai_password@postgres:5432/ai_db
      - QDRANT_URL=http://qdrant:6333
      - LITELLM_URL=http://litellm:4000
      - LANGFUSE_HOST=http://langfuse:3000
    depends_on:
      - kafka
      - postgres
      - qdrant
      - litellm
    env_file:
      - .env

volumes:
  postgres_data:
  kafka_data: